<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bolo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B4FD8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column. Language pair on top, what you said, what it means, mic dock pinned to the bottom. */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --ink: #142033;
  --muted: #5B6B80;
  --line: #D8DEE7;
  --accent: #1B4FD8;
  --accent-ink: #FFFFFF;
  --soft: #E8EEFB;
  --live: #D6372A;
  --font-display: "Bricolage Grotesque", "Noto Sans", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", "Noto Sans", "Noto Sans Devanagari", "Noto Sans Tamil", "Noto Sans Telugu", "Noto Sans Bengali", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1118; --surface: #151D28; --ink: #E7EDF5; --muted: #92A1B5;
    --line: #26313F; --accent: #7EA2FF; --accent-ink: #0C1118; --soft: #1B2740; --live: #FF6B5C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1118; --surface: #151D28; --ink: #E7EDF5; --muted: #92A1B5;
  --line: #26313F; --accent: #7EA2FF; --accent-ink: #0C1118; --soft: #1B2740; --live: #FF6B5C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--font-body);
  padding-block: max(20px, env(safe-area-inset-top, 0px)) 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding-bottom: 170px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 800 2rem/1 var(--font-display); letter-spacing: -0.02em; margin: 0; }
.tag { margin: 0; color: var(--muted); font-size: 0.9rem; }
.langs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: end; }
.sel { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.sel span, .card-head h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin: 0; }
select {
  width: 100%; min-width: 0; appearance: none; font: 500 1rem var(--font-body); color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#swap { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
#swap svg { width: 20px; height: 20px; }
.notice { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.card.out { background: var(--soft); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tools { display: flex; gap: 6px; align-items: center; }
.tools button { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 0.85rem; color: var(--ink); }
.tools button:disabled { opacity: 0.4; cursor: default; }
.note { font-size: 0.8rem; color: var(--muted); }
textarea#src {
  width: 100%; min-height: 150px; resize: vertical; border: 0; background: transparent; color: var(--ink);
  font: 1.25rem/1.5 var(--font-body); padding: 0;
}
textarea#src::placeholder { color: var(--muted); }
#out { min-height: 150px; font-size: 1.25rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
#out:empty::before { content: attr(data-empty); color: var(--muted); }
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 24px max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 62%, transparent);
  pointer-events: none;
}
.dock > * { pointer-events: auto; }
#mic {
  width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; position: relative; box-shadow: 0 6px 20px rgba(27, 79, 216, 0.28);
}
#mic svg { width: 32px; height: 32px; }
#mic.live { background: var(--live); color: #fff; }
#mic.live::after {
  content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 3px solid var(--live);
  animation: pulse 1.4s ease-out infinite;
}
@keyframes pulse { from { transform: scale(0.85); opacity: 0.8; } to { transform: scale(1.25); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #mic.live::after { animation: none; opacity: 0.5; } }
#status { margin: 0; font-size: 0.9rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Bolo</h1>
    <p class="tag">Speak. It types. It translates.</p>
  </header>

  <div class="langs">
    <label class="sel" for="from"><span>You speak</span><select id="from"></select></label>
    <button id="swap" type="button" aria-label="Swap languages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>
    </button>
    <label class="sel" for="to"><span>Translate to</span><select id="to"></select></label>
  </div>

  <div class="notice" id="notice" hidden></div>

  <section class="card">
    <div class="card-head">
      <h2 id="srcLabel">What you said</h2>
      <div class="tools">
        <button id="clear" type="button">Clear</button>
        <button id="copySrc" type="button">Copy</button>
      </div>
    </div>
    <textarea id="src" rows="5" placeholder="Tap the mic and start talking. You can also type or fix words here." spellcheck="false"></textarea>
  </section>

  <section class="card out">
    <div class="card-head">
      <h2 id="outLabel">Translation</h2>
      <div class="tools">
        <span class="note" id="busy"></span>
        <button id="listen" type="button" disabled>Listen</button>
        <button id="copyOut" type="button" disabled>Copy</button>
      </div>
    </div>
    <div id="out" aria-live="polite" data-empty="The translation shows up here as you speak."></div>
  </section>
</main>

<div class="dock">
  <button id="mic" type="button" aria-label="Start listening">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
  <p id="status">Tap the mic to start</p>
</div>

<script>
const LANGS = [
  { n: "English",    sr: "en-IN",      t: "en" },
  { n: "Hindi",      sr: "hi-IN",      t: "hi" },
  { n: "Tamil",      sr: "ta-IN",      t: "ta" },
  { n: "Telugu",     sr: "te-IN",      t: "te" },
  { n: "Kannada",    sr: "kn-IN",      t: "kn" },
  { n: "Malayalam",  sr: "ml-IN",      t: "ml" },
  { n: "Bengali",    sr: "bn-IN",      t: "bn" },
  { n: "Marathi",    sr: "mr-IN",      t: "mr" },
  { n: "Gujarati",   sr: "gu-IN",      t: "gu" },
  { n: "Punjabi",    sr: "pa-Guru-IN", t: "pa" },
  { n: "Urdu",       sr: "ur-IN",      t: "ur" },
  { n: "Spanish",    sr: "es-ES",      t: "es" },
  { n: "French",     sr: "fr-FR",      t: "fr" },
  { n: "German",     sr: "de-DE",      t: "de" },
  { n: "Portuguese", sr: "pt-BR",      t: "pt" },
  { n: "Russian",    sr: "ru-RU",      t: "ru" },
  { n: "Arabic",     sr: "ar-SA",      t: "ar" },
  { n: "Japanese",   sr: "ja-JP",      t: "ja" },
  { n: "Korean",     sr: "ko-KR",      t: "ko" },
  { n: "Chinese",    sr: "zh-CN",      t: "zh-CN" }
];

const $ = (id) => document.getElementById(id);
const fromSel = $("from"), toSel = $("to"), src = $("src"), out = $("out"), mic = $("mic");
const statusEl = $("status"), notice = $("notice"), busy = $("busy");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

let finalText = "", interim = "", listening = false, rec = null;
let timer = null, reqId = 0, lastTranslation = "";
const cache = new Map();
const builtin = new Map();

LANGS.forEach((l, i) => {
  fromSel.add(new Option(l.n, i));
  toSel.add(new Option(l.n, i));
});
function load(key, fallback) {
  try { const v = localStorage.getItem(key); if (v !== null && LANGS[+v]) return v; } catch (_) {}
  return fallback;
}
fromSel.value = load("bolo.from", "0");
toSel.value = load("bolo.to", "1");
function save() { try { localStorage.setItem("bolo.from", fromSel.value); localStorage.setItem("bolo.to", toSel.value); } catch (_) {} }
const cur = (which) => LANGS[+(which === "from" ? fromSel : toSel).value];

function labels() {
  $("srcLabel").textContent = "What you said · " + cur("from").n;
  $("outLabel").textContent = "In " + cur("to").n;
}
function say(msg) { statusEl.textContent = msg; }
function warn(msg) { notice.hidden = !msg; notice.textContent = msg || ""; }

function fullText() {
  if (!interim) return finalText;
  return finalText + (finalText && !/\s$/.test(finalText) ? " " : "") + interim;
}
function renderSrc() { src.value = fullText(); src.scrollTop = src.scrollHeight; }
function setOut(text) {
  lastTranslation = text;
  out.textContent = text;
  $("listen").disabled = !text;
  $("copyOut").disabled = !text;
}

/* ---------- Voice typing ---------- */
function buildRec() {
  const r = new SR();
  r.lang = cur("from").sr;
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 1;
  r.onresult = (e) => {
    let live = "";
    let gotFinal = false;
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) {
        const t = res[0].transcript.trim();
        if (t) { finalText += (finalText && !/\s$/.test(finalText) ? " " : "") + t; gotFinal = true; }
      } else {
        live += res[0].transcript;
      }
    }
    interim = live.trim();
    renderSrc();
    schedule(gotFinal ? 250 : 700);
  };
  r.onerror = (e) => {
    if (e.error === "no-speech" || e.error === "aborted") return;
    const fatal = ["not-allowed", "service-not-allowed", "audio-capture", "language-not-supported"];
    if (fatal.includes(e.error)) {
      listening = false;
      setLive();
    }
    const msgs = {
      "not-allowed": "Microphone is blocked. Allow mic access for this page in your browser settings, then try again.",
      "service-not-allowed": "Speech recognition is turned off on this device or browser.",
      "audio-capture": "No microphone was found.",
      "language-not-supported": "This browser can't recognise " + cur("from").n + " speech. Try another language or Chrome.",
      "network": "Speech recognition needs an internet connection."
    };
    warn(msgs[e.error] || "Speech recognition stopped (" + e.error + ").");
  };
  r.onend = () => {
    interim = "";
    renderSrc();
    if (listening) {
      setTimeout(() => { if (listening) { try { r.start(); } catch (_) {} } }, 250);
    } else {
      setLive();
    }
  };
  return r;
}
function setLive() {
  mic.classList.toggle("live", listening);
  mic.setAttribute("aria-label", listening ? "Stop listening" : "Start listening");
  say(listening ? "Listening in " + cur("from").n + ". Tap to stop." : "Tap the mic to start");
}
function startListening() {
  if (!SR) return;
  warn("");
  rec = buildRec();
  listening = true;
  try { rec.start(); } catch (_) {}
  setLive();
}
function stopListening() {
  listening = false;
  if (rec) { try { rec.stop(); } catch (_) {} }
  setLive();
}
mic.addEventListener("click", () => (listening ? stopListening() : startListening()));

if (!SR) {
  warn("Voice typing isn't supported in this browser. Open this file in Chrome, Edge or Safari. You can still type below and get translations.");
  mic.disabled = true;
  mic.style.opacity = "0.45";
  say("Voice typing unavailable here");
}

/* ---------- Translation ---------- */
function splitText(text) {
  const sentences = text.split(/(?<=[.!?।۔。！？])\s+/).filter(Boolean);
  const parts = [];
  for (const s of sentences) {
    if (s.length <= 450) { parts.push(s); continue; }
    let rest = s;
    while (rest.length > 450) {
      let cut = rest.lastIndexOf(" ", 450);
      if (cut < 100) cut = 450;
      parts.push(rest.slice(0, cut));
      rest = rest.slice(cut).trim();
    }
    if (rest) parts.push(rest);
  }
  return parts;
}
async function getBuiltin(f, t) {
  if (!("Translator" in self)) return null;
  const key = f + ">" + t;
  if (builtin.has(key)) return builtin.get(key);
  let tr = null;
  try {
    const a = await self.Translator.availability({ sourceLanguage: f, targetLanguage: t });
    if (a === "available") tr = await self.Translator.create({ sourceLanguage: f, targetLanguage: t });
  } catch (_) {}
  builtin.set(key, tr);
  return tr;
}
async function translatePart(p, f, t) {
  const key = f + "|" + t + "|" + p;
  if (cache.has(key)) return cache.get(key);
  let result = null;
  const local = await getBuiltin(f, t);
  if (local) {
    try { result = await local.translate(p); } catch (_) {}
  }
  if (result === null) {
    const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(p) + "&langpair=" + encodeURIComponent(f + "|" + t);
    const res = await fetch(url);
    if (!res.ok) throw new Error("http " + res.status);
    const data = await res.json();
    if (String(data.responseStatus) !== "200") throw new Error("api " + data.responseStatus);
    result = data.responseData.translatedText;
  }
  cache.set(key, result);
  return result;
}
function schedule(delay) {
  clearTimeout(timer);
  timer = setTimeout(run, delay == null ? 600 : delay);
}
async function run() {
  const text = fullText().trim();
  const id = ++reqId;
  if (!text) { setOut(""); busy.textContent = ""; return; }
  const f = cur("from").t, t = cur("to").t;
  if (f === t) { setOut(text); busy.textContent = ""; return; }
  busy.textContent = "Translating…";
  try {
    const parts = splitText(text);
    const done = await Promise.all(parts.map((p) => translatePart(p, f, t)));
    if (id !== reqId) return;
    setOut(done.join(" "));
    busy.textContent = "";
    if (notice.textContent.startsWith("Translation")) warn("");
  } catch (e) {
    if (id !== reqId) return;
    busy.textContent = "";
    warn("Translation failed. Check your internet connection. The free service also has a daily limit.");
  }
}

/* ---------- Controls ---------- */
src.addEventListener("input", () => { finalText = src.value; interim = ""; schedule(600); });
function onLangChange() {
  save(); labels();
  cache.size > 400 && cache.clear();
  if (listening) { listening = false; if (rec) { rec.onend = null; try { rec.abort(); } catch (_) {} } startListening(); }
  schedule(50);
}
fromSel.addEventListener("change", onLangChange);
toSel.addEventListener("change", onLangChange);
$("swap").addEventListener("click", () => {
  const a = fromSel.value;
  fromSel.value = toSel.value;
  toSel.value = a;
  if (lastTranslation) { finalText = lastTranslation; interim = ""; renderSrc(); }
  onLangChange();
});
$("clear").addEventListener("click", () => { finalText = ""; interim = ""; renderSrc(); setOut(""); busy.textContent = ""; reqId++; });

async function copy(text, btn) {
  if (!text) return;
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(text); }
  catch (_) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (__) {}
    ta.remove();
  }
  btn.textContent = "Copied";
  setTimeout(() => (btn.textContent = old), 1200);
}
$("copySrc").addEventListener("click", (e) => copy(src.value, e.currentTarget));
$("copyOut").addEventListener("click", (e) => copy(lastTranslation, e.currentTarget));
$("listen").addEventListener("click", () => {
  if (!lastTranslation || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(lastTranslation);
  u.lang = cur("to").sr;
  speechSynthesis.speak(u);
});

if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => {}); }
labels();
say(SR ? "Tap the mic to start" : "Voice typing unavailable here");
</script>
</body>
</html>
